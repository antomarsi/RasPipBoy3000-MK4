[project]
name = "raspipboy3000-mk4"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "esper>=3.8",
    "ffmpeg-python>=0.2.0",
    "numpy>=2.4.6",
    "pyaudio>=0.2.14",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pygame-ce>=2.5.8",
    "python-dotenv>=1.2.3",
    "pytweening>=1.2.0",
    "requests>=2.32.0",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
pi = [
    "gpiozero>=2.0.1.post3",
    "lgpio>=0.2.2.0 ; sys_platform == 'linux'",
    "pyserial>=3.5",
    "pynmea2>=1.19.0",
]
# Dev-only asset tooling (objloader/objviewer.py): renders a .obj model via
# real OpenGL and turntables it into a numbered PNG sprite sequence, the
# same "multi-frame image sequence" shape already used for vault_boy_1..8
# and SPECIAL's icons. Never imported by the app itself at runtime (it
# renders 2D sprites via SDL2, not OpenGL) -- PyOpenGL needs a real GPU/
# driver context a Pi Zero 2 W headless boot won't have, so it's kept out
# of the base install entirely, not just the `pi` extra (which is for
# things the *app* needs on real hardware; this is the opposite case --
# desktop-only, dev-only). pygame-ce/numpy are already base dependencies.
objloader = [
    "PyOpenGL>=3.1.7",
]
